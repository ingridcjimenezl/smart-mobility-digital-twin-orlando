name: Bird Orlando Data Collection

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install requests pandas

      - name: Collect Bird data
        run: python collect_bird_data.py

      - name: Save historical CSV
        run:
          git config user.name "github-actions[bot]
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bird_orlando_history.csv
          git diff --cached --quiet || (git commit -m "Update Bird historical data" && git push)
