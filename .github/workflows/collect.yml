name: Bird Orlando Data Collection

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"


permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install requests pandas

      - name: Collect Bird data
        run: python collect_bird_data.py

      - name: Save historical CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bird_orlando_history.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update Bird historical data"
            git push
          else
            echo "No new data changes to save"
          fi
